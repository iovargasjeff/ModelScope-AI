name: Update dataset

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dataset-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check code before updating data
        run: |
          ruff check app.py src scripts tests
          pytest -q
      - name: Fetch and validate the latest public data
        run: python scripts/fetch_data.py
      - name: Commit only a new validated source run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leaderboards.json data/models.csv data/metadata.json
          if git diff --cached --quiet; then
            echo "No source data changes to commit."
          else
            git commit -m "data: update ModelVerdict snapshot"
            git push
          fi
